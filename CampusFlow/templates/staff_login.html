<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Staff Login - CampusFlow</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container">

    <h1>👨‍💼 CampusFlow</h1>

    <h2>Staff Login</h2>

    <div class="menu-item">

        {% if error %}
            <p style="color: red;">
                {{ error }}
            </p>
        {% endif %}

        <form method="POST">

            <p>
                <input
                    type="text"
                    name="username"
                    placeholder="Username"
                    required
                >
            </p>

            <p>
                <input
                    type="password"
                    name="password"
                    placeholder="Password"
                    required
                >
            </p>

            <button type="submit">
                Login
            </button>

        </form>

    </div>

    <a href="/">
        <button>Back to Home</button>
    </a>

</div>

</body>
</html>
